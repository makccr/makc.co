---
layout: main.html
title: Quotes
description: A collection of quotes that I've put together over the years. 
---

<h1>{{ title }}</h1>
<p class="caption"> {{ description }} </p>

<div class="linksContainer">
{% for quote in quotes %}
    <div class="linksCard">
        <h2 id="site">{{ quote.quote }}</h2>
        <p id="caption">{{ quote.author }}</p>
    </div>
{% endfor %}
</div>
