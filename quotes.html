---
layout: main.html
title: Quotes
description: A collection of quotes that I've put together over the years. 
---

<h1>{{ title }}</h1>
<p class="caption"> {{ description }} </p>

{% for quote in quotes %}
    <div class="quoteContainer">
        <p class="quoteText">{{ quote.quote }}</p>
        <p class="quoteAuthor">{{ quote.author }}</p>
    </div>
{% endfor %}
